<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Estimate Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fff; color: #222; font-size: 13px; }
.header { padding: 10px 24px 4px; display: flex; justify-content: space-between; align-items: flex-start; }
.header-left h1 { font-size: 20px; font-weight: 600; }
.header-left .subtitle { color: #666; font-size: 12px; margin-top: 2px; }
.header-right { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.header-center { display: none; flex-direction: column; gap: 2px; flex: 1; max-width: 450px; margin: 0 24px; }
.header-center.visible { display: flex; }
.header-center label { font-size: 10px; color: #555; white-space: nowrap; }
.table-wrap { overflow: auto; max-height: calc(100vh - 90px); position: relative; padding: 0 12px 60px; }
table { border-collapse: collapse; white-space: nowrap; font-size: 12px; }
th, td { padding: 4px 8px; border-bottom: 1px solid #e8e8e8; text-align: right; }
th { background: #fafafa; position: sticky; z-index: 2; font-weight: 600; font-size: 11px; color: #555; }
thead tr:first-child th { top: 0; background: #f4f4f4; box-shadow: inset 0 -2px 0 #999; }
thead tr:nth-child(2) th { top: 23px; background: #fafafa; box-shadow: inset 0 -2px 0 #ccc; }
th.col-group { text-align: center; background: #f4f4f4; }
td:first-child, th:first-child { text-align: left; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { background: #e8e8e8; }
th.sort-asc::after { content: ' ▲'; font-size: 9px; }
th.sort-desc::after { content: ' ▼'; font-size: 9px; }
.row-even { background: #fff; }
.row-odd { background: #f7f7f7; }
.row-even td:first-child { background: #fff; }
.row-odd td:first-child { background: #f7f7f7; }
.group-header td { font-weight: 700; font-size: 13px; background: #e8e8e8 !important; color: #333; border-bottom: 2px solid #ccc; }
.group-spacer td { height: 12px; background: #fff !important; border: none; }
.pos { color: #2e7d32; }
.neg { color: #c62828; }
.ticker-cell { font-weight: 700; font-size: 13px; }
.eps-tag { font-size: 10px; font-weight: 400; color: #888; margin-left: 2px; vertical-align: super; }
td.spark-cell { padding: 4px 2px; }
.sparkline { cursor: pointer; vertical-align: middle; }
.sparkline:hover { opacity: 0.7; }
.year-sep { border-left: 2px solid #ccc; }
.detail-row td { text-align: left !important; padding: 8px 16px; font-size: 11px; background: #f8f9fc !important; color: #444; border-bottom: 1px solid #ddd; }
.detail-row td:first-child { background: #f8f9fc !important; }
.detail-table { border-collapse: collapse; margin: 4px 0; font-size: 11px; }
.detail-table th { position: static; background: #eef1f5; font-weight: 600; font-size: 10px; color: #555; padding: 3px 8px; border: 1px solid #ddd; text-align: center; }
.detail-table td { padding: 3px 8px; border: 1px solid #eee; text-align: right; font-size: 11px; }
.detail-table .yr-label { text-align: left; font-weight: 600; color: #333; background: #f4f6f9; }
.detail-table .chg-row td { font-size: 10px; color: #888; border-top: none; padding-top: 0; }
.methodology { padding: 0 24px; font-size: 10px; color: #999; max-width: 1000px; line-height: 1.5; }
.methodology details { border-top: 1px solid #e0e0e0; padding-top: 8px; }
.methodology summary { font-size: 11px; color: #888; cursor: pointer; padding: 4px 0; }
.methodology p { margin-top: 4px; }
.btn-group { display: flex; gap: 0; }
.btn-group button { padding: 3px 10px; font-size: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; color: #555; }
.btn-group button:first-child { border-radius: 4px 0 0 4px; }
.btn-group button:last-child { border-radius: 0 4px 4px 0; }
.btn-group button + button { border-left: none; }
.btn-group button.active { background: #1565c0; color: #fff; border-color: #1565c0; }
.group-label { font-size: 10px; color: #888; }
.subgroup-header td { font-weight: 600; font-size: 12px; background: #f0f0f0 !important; color: #555; padding: 6px 7px 3px; border-bottom: 1px solid #ccc; font-style: italic; }
.tabs { display: flex; gap: 0; padding: 0 24px; border-bottom: 2px solid #ccc; }
.tab { padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer; color: #888; border: 1px solid transparent; border-bottom: none; margin-bottom: -2px; border-radius: 4px 4px 0 0; }
.tab:hover { color: #333; }
.tab.active { color: #1565c0; background: #fff; border-color: #ccc; border-bottom: 2px solid #fff; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.agg-table { border-collapse: collapse; white-space: nowrap; font-size: 12px; table-layout: fixed; }
.agg-table col.col-name { width: 200px; }
.agg-table col.col-count { width: 30px; }
.agg-table col.col-data { width: 58px; }
.agg-table th, .agg-table td { padding: 5px 10px; border-bottom: 1px solid #e8e8e8; text-align: right; }
.agg-table th { background: #fafafa; font-weight: 600; font-size: 11px; color: #555; }
.agg-table th.agg-group { text-align: center; background: #f4f4f4; border-bottom: 2px solid #999; }
.agg-table th.agg-sub { border-bottom: 2px solid #ccc; }
.agg-table th.sortable { cursor: pointer; user-select: none; }
.agg-table th.sortable:hover { background: #e8e8e8; }
.agg-table td:first-child { text-align: left; font-weight: 600; cursor: pointer; }
.agg-table td:first-child:hover { text-decoration: underline; color: #1565c0; }
.agg-row-even { background: #fff; }
.agg-row-odd { background: #f7f7f7; }
.agg-controls { padding: 8px 24px; display: flex; align-items: center; gap: 16px; }
.agg-controls .group-label { font-size: 11px; }
.analysis-wrap { padding: 12px 24px; overflow: auto; max-height: calc(100vh - 90px); }
.analysis-section { margin-bottom: 32px; font-size: 13px; }
.analysis-section h3 { font-size: 15px; color: #333; margin-bottom: 8px; }
.analysis-columns { display: flex; gap: 16px; }
.analysis-columns > div { flex: 1; min-width: 0; }
.analysis-columns .rank-table { width: 100%; }
.rank-table { border-collapse: collapse; font-size: 12px; }
.rank-table th, .rank-table td { padding: 3px 8px; border-bottom: 1px solid #e8e8e8; text-align: right; white-space: nowrap; }
.rank-table th { background: #fafafa; font-weight: 600; font-size: 10px; color: #555; border-bottom: 2px solid #ccc; cursor: pointer; user-select: none; }
.rank-table th:hover { background: #e8e8e8; }
.rank-table th:first-child, .rank-table td:first-child { text-align: left; }
.scatter-wrap { display: flex; gap: 16px; margin-bottom: 24px; }
.scatter-chart { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px; flex: 1; min-width: 0; margin-bottom: 20px; }
.scatter-chart h4 { font-size: 12px; color: #555; margin-bottom: 8px; text-align: center; }
.chart-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 6px 0; font-size: 10px; color: #555; }
.chart-controls label { display: flex; align-items: center; gap: 3px; }
.chart-controls select, .chart-controls input[type=number] { font-size: 10px; padding: 2px 4px; border: 1px solid #ccc; border-radius: 3px; width: 55px; }
.chart-controls select { width: auto; }
.chart-controls .ctrl-group { display: flex; align-items: center; gap: 4px; }
.chart-controls .ctrl-sep { border-left: 1px solid #ddd; height: 16px; margin: 0 4px; }
.zero-sep { border-left: 1px solid #ccc; }
.agg-detail { background: #f8f9fc !important; }
.agg-detail td { font-size: 11px; color: #555; font-weight: 400 !important; padding: 5px 10px; border-bottom: 1px solid #eee; }
.agg-detail td:first-child { font-weight: 400 !important; cursor: default; padding-left: 28px; color: #666; }
.agg-detail td:first-child:hover { text-decoration: none; color: #666; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Portfolio Estimate Tracker</h1>
  </div>
  <div class="header-center" id="sliderWrap">
    <div style="display:flex;align-items:center;gap:6px;">
      <label style="width:100px;text-align:right;">BBG cons estimates:</label>
      <input type="range" id="estSlider" min="0" max="0" value="0" style="width:120px;">
      <span id="estDateLabel" style="font-weight:600;font-size:11px;min-width:80px;"></span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <label style="width:100px;text-align:right;">Prices:</label>
      <input type="range" id="priceSlider" min="0" max="0" value="0" style="width:120px;">
      <span id="priceDateLabel" style="font-weight:600;font-size:11px;min-width:80px;"></span>
    </div>
  </div>
  <div class="header-right">
    <span class="group-label">Group by:</span>
    <div class="btn-group" id="groupToggle">
      <button data-group="none" class="active">None</button>
      <button data-group="category">Category</button>
      <button data-group="gics_sector">GICS Sector</button>
      <button data-group="gics_industry">GICS Industry</button>
    </div>
  </div>
</div>
<div class="tabs">
  <div class="tab active" data-tab="companies">Companies</div>
  <div class="tab" data-tab="aggregates">Sector Aggregates</div>
  <div class="tab" data-tab="analysis">Analysis</div>
  <div class="tab" data-tab="peers">Peers</div>
  <div class="tab" data-tab="other">Other</div>
</div>
<div class="tab-content active" id="tab-companies">
  <div class="table-wrap" id="tableWrap"></div>
</div>
<div class="tab-content" id="tab-aggregates">
  <div class="agg-controls">
    <span class="group-label">Aggregate by:</span>
    <div class="btn-group" id="aggGroupToggle">
      <button data-agg="gics_sector" class="active">GICS Sector</button>
      <button data-agg="gics_industry">GICS Industry</button>
    </div>
  </div>
  <div class="table-wrap" id="aggTableWrap"></div>
</div>
<div class="tab-content" id="tab-analysis">
  <div class="analysis-wrap" id="analysisWrap"></div>
</div>
<div class="tab-content" id="tab-peers">
  <div class="analysis-wrap" id="peersWrap"></div>
</div>
<div class="tab-content" id="tab-other">
  <div class="analysis-wrap" id="otherWrap"></div>
</div>

<script>
(async function() {

  let lastData = null;
  let currentGrouping = 'none';
  let currentQCols = [];
  let currentAggGroup = 'gics_sector';
  let aggSortState = { key: null, dir: 'desc' };
  const COLS_PER_YEAR = 9;
  const displayYears = ['CY2026', 'CY2027', 'CY2028'];
  const INDEX_TICKERS = new Set(['SPX', 'SOX', 'QQQ', 'IWM', 'IGV']);
  const PEER_MAP = {
    'HCA':  ['THC', 'UHS', 'CYH', 'DVA', 'DGX'],
    'UNH':  ['CI', 'ELV', 'HUM', 'CNC', 'MOH'],
    'TSM':  ['005930', '000660', 'INTC', 'MU', 'GFS', 'LRCX', 'AMAT', 'ASML'],
    'AVGO': ['QCOM', 'MRVL', 'AMD', 'TXN', 'ADI'],
    'NVDA': ['AMD', 'INTC', 'AVGO', 'MRVL', 'ARM', '2454'],
    'META': ['GOOG', 'PINS', 'SNAP', 'RDDT', 'TTD'],
    'AMZN': ['GOOG', 'MSFT', 'SHOP', 'BKNG', 'EBAY', 'WMT', 'COST'],
    'JPM':  ['GS', 'BAC', 'MS', 'WFC', 'C'],
    'APO':  ['BX', 'KKR', 'ARES', 'CG', 'OWL', 'BAM', 'BN'],
    'PGR':  ['ALL', 'TRV', 'CB', 'AIG', 'ACGL', 'KMPR'],
    'CVNA': ['KMX', 'AN', 'CPRT', 'GPI', 'SAH', 'LAD'],
    'APP':  ['RDDT', 'TTD', 'PINS', 'DASH', 'U'],
    'VEEV': ['CRM', 'WDAY', 'NOW', 'DDOG', 'GWRE', 'INTU'],
  };

  // Load both estimate and price indices
  let estDates = [], priceDates = [], currentEstDate, currentPriceDate;
  let currentEstData = null, currentPriceData = null;

  try {
    const [estResp, priceResp] = await Promise.all([
      fetch('output/snapshots/index_estimates.json'),
      fetch('output/snapshots/index_prices.json').catch(() => null),
    ]);
    if (estResp.ok) estDates = [...(await estResp.json())].sort();
    if (priceResp && priceResp.ok) priceDates = [...(await priceResp.json())].sort();
    // Fallback: try legacy index.json
    if (!estDates.length) {
      const legacyResp = await fetch('output/snapshots/index.json');
      if (legacyResp.ok) estDates = [...(await legacyResp.json())].sort();
    }
  } catch (e) {}

  if (!estDates.length) {
    document.getElementById('estDateLabel').textContent = 'No snapshots. Run pull_estimates.py';
    return;
  }

  currentEstDate = estDates[estDates.length - 1];
  currentPriceDate = priceDates.length ? priceDates[priceDates.length - 1] : null;

  const sliderWrap = document.getElementById('sliderWrap');
  sliderWrap.classList.add('visible');

  // Estimate slider
  const estSlider = document.getElementById('estSlider');
  estSlider.max = Math.max(0, estDates.length - 1);
  estSlider.value = estDates.length - 1;
  document.getElementById('estDateLabel').textContent = currentEstDate;
  estSlider.addEventListener('input', () => {
    currentEstDate = estDates[+estSlider.value];
    document.getElementById('estDateLabel').textContent = currentEstDate;
    loadEstimates(currentEstDate);
  });

  // Price slider
  const priceSlider = document.getElementById('priceSlider');
  if (priceDates.length) {
    priceSlider.max = Math.max(0, priceDates.length - 1);
    priceSlider.value = priceDates.length - 1;
    document.getElementById('priceDateLabel').textContent = currentPriceDate;
    priceSlider.addEventListener('input', () => {
      currentPriceDate = priceDates[+priceSlider.value];
      document.getElementById('priceDateLabel').textContent = currentPriceDate;
      loadPrices(currentPriceDate);
    });
  } else {
    document.getElementById('priceDateLabel').textContent = 'N/A (run pull_prices.py)';
  }

  await loadEstimates(currentEstDate);
  if (currentPriceDate) await loadPrices(currentPriceDate);

  async function loadEstimates(date) {
    document.getElementById('estDateLabel').textContent = date;
    try {
      // Try new naming first, fall back to legacy
      let resp = await fetch('output/snapshots/estimates_' + date + '.csv');
      if (!resp.ok) resp = await fetch('output/snapshots/' + date + '.csv');
      if (!resp.ok) throw new Error('CSV not found');
      const text = await resp.text();
      currentEstData = parseCSV(text);
      renderAll();
    } catch (e) {
      document.getElementById('estDateLabel').textContent = 'Error: ' + e.message;
    }
  }

  async function loadPrices(date) {
    document.getElementById('priceDateLabel').textContent = date;
    try {
      const resp = await fetch('output/snapshots/prices_' + date + '.csv');
      if (!resp.ok) throw new Error('Prices CSV not found');
      const text = await resp.text();
      currentPriceData = parseCSV(text);
      renderAll();
    } catch (e) {
      document.getElementById('priceDateLabel').textContent = 'Error: ' + e.message;
    }
  }

  function mergeEstimatesWithPrices(estData, priceData) {
    if (!priceData) return estData;
    // Build price lookup by ticker
    const priceLookup = {};
    priceData.rows.forEach(r => { priceLookup[r.Ticker] = r; });
    // Override price/return fields in estimate rows
    const merged = { ...estData, rows: estData.rows.map(r => {
      const p = priceLookup[r.Ticker];
      if (!p) return r;
      return { ...r, Price: p.Price || r.Price, PE: p.PE_CY2026 || r.PE,
        Return_YTD: p.Return_YTD || r.Return_YTD, Return_3m: p.Return_3m || r.Return_3m,
        Return_12m: p.Return_12m || r.Return_12m };
    })};
    return merged;
  }

  function renderAll() {
    if (!currentEstData) return;
    const data = mergeEstimatesWithPrices(currentEstData, currentPriceData);
    render(data);
    renderAggregates(data);
    renderAnalysis(data);
    renderOther(data);
    renderPeers(data);
    renderMethodology(data.qCols);
  }

  function formatDate(s) {
    return new Date(s + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function parseCSV(text) {
    const lines = text.replace(/\r/g, '').trim().split('\n');
    const headers = parseCsvLine(lines[0]);
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const vals = parseCsvLine(lines[i]);
      const obj = {};
      headers.forEach((h, idx) => obj[h] = vals[idx] || '');
      rows.push(obj);
    }
    const re = /^Q[1-4] 20\d{2}$/;
    const qCols = headers.filter(h => re.test(h));
    return { headers, rows, qCols };
  }

  function parseCsvLine(line) {
    const result = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { result.push(cur); cur = ''; }
      else { cur += ch; }
    }
    result.push(cur);
    return result;
  }

  // --- Render functions ---

  // Grouping toggle
  document.querySelectorAll('#groupToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#groupToggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentGrouping = btn.dataset.group;
      if (lastData) render(lastData);
    });
  });

  function render(data) {
    lastData = data;
    const { rows, qCols } = data;
    currentQCols = qCols;

    const tickers = [];
    const tickerMap = {};
    rows.forEach(r => {
      const t = r.Ticker;
      if (!tickerMap[t]) {
        tickerMap[t] = {
          ticker: t, group: r.Group, epsType: r['EPS Type'] || 'Adj',
          fye: r['FYE'] || '', category: r['Category'] || '',
          gicsSector: r['GICS Sector'] || '', gicsIndustry: r['GICS Industry'] || '',
          years: {},
        };
        tickers.push(tickerMap[t]);
      }
      tickerMap[t].years[r.Year] = r;
    });

    const portfolio = tickers.filter(t => t.group === 'Portfolio');
    const watchlist = tickers.filter(t => t.group === 'Watchlist');
    const indices = tickers.filter(t => t.group === 'Indices');
    const extended = tickers.filter(t => t.group === 'Extended');
    const totalCols = 6 + displayYears.length * COLS_PER_YEAR + 3;

    const table = document.createElement('table');
    table.id = 'mainTable';

    // Header row 1
    const h1 = document.createElement('tr');
    addTH(h1, '', 1, 'col-group'); // Ticker
    addTH(h1, '', 1, 'col-group'); // Price
    addTH(h1, 'P/E', 3, 'col-group'); // P/E 26 + 27 + 28
    addTH(h1, '', 1, 'col-group'); // FYE
    displayYears.forEach(y => addTH(h1, y, COLS_PER_YEAR, 'col-group year-sep'));
    addTH(h1, 'Returns', 3, 'col-group year-sep');

    // Header row 2 (all sortable)
    const h2 = document.createElement('tr');
    addSortTH(h2, 'Ticker', 'ticker');
    addSortTH(h2, 'Price', 'price');
    addSortTH(h2, "'26", 'pe26');
    addSortTH(h2, "'27", 'pe27');
    addSortTH(h2, "'28", 'pe28');
    addSortTH(h2, 'FYE', 'fye');
    displayYears.forEach(yr => {
      addSortTH(h2, 'Cur', 'cur_' + yr, 'year-sep');
      addSortTH(h2, '-3m', 'm3_' + yr);
      addSortTH(h2, '-6m', 'm6_' + yr);
      addSortTH(h2, '-1yr', 'm12_' + yr);
      addTH(h2, ''); // sparkline
      addSortTH(h2, '3m%', 'chg3_' + yr);
      addSortTH(h2, '3-6m%', 'chg36_' + yr);
      addSortTH(h2, '6-12m%', 'chg612_' + yr);
      addSortTH(h2, '12m%', 'rev12_' + yr);
    });
    addSortTH(h2, 'YTD', 'retytd', 'year-sep');
    addSortTH(h2, 'L3M', 'ret3m');
    addSortTH(h2, '1Y', 'ret12');

    const thead = document.createElement('thead');
    thead.appendChild(h1);
    thead.appendChild(h2);
    table.appendChild(thead);

    // Store parsed data for sorting
    const tickerData = { portfolio, watchlist, qCols };
    table._tickerData = tickerData;

    const tbody = document.createElement('tbody');
    buildGroup(tbody, 'Portfolio', portfolio, qCols, totalCols);
    addSpacer(tbody, totalCols);
    buildGroup(tbody, 'Watchlist', watchlist, qCols, totalCols);
    if (indices.length > 0) {
      addSpacer(tbody, totalCols);
      buildGroup(tbody, 'Indices', indices, qCols, totalCols);
    }

    // Extended watchlist with optional sub-grouping
    if (extended.length > 0) {
      addSpacer(tbody, totalCols);
      if (currentGrouping === 'none') {
        buildGroup(tbody, 'Extended Watchlist', extended, qCols, totalCols);
      } else {
        // Group header
        const gr = document.createElement('tr');
        gr.className = 'group-header';
        const gdTd = document.createElement('td');
        gdTd.colSpan = totalCols;
        gdTd.textContent = 'Extended Watchlist';
        gr.appendChild(gdTd);
        tbody.appendChild(gr);

        // Sub-group by selected field
        const groupField = currentGrouping === 'category' ? 'category'
          : currentGrouping === 'gics_sector' ? 'gicsSector' : 'gicsIndustry';
        const subGroups = {};
        extended.forEach(tk => {
          const key = tk[groupField] || 'Other';
          if (!subGroups[key]) subGroups[key] = [];
          subGroups[key].push(tk);
        });
        const sortedKeys = Object.keys(subGroups).sort((a, b) => {
          if (a === 'Other') return 1;
          if (b === 'Other') return -1;
          return a.localeCompare(b);
        });
        let rowIdx = 0;
        for (const key of sortedKeys) {
          // Sub-group header
          const sgr = document.createElement('tr');
          sgr.className = 'subgroup-header';
          const sgTd = document.createElement('td');
          sgTd.colSpan = totalCols;
          sgTd.textContent = key + ' (' + subGroups[key].length + ')';
          sgr.appendChild(sgTd);
          tbody.appendChild(sgr);
          subGroups[key].forEach((tk, idx) => buildTickerRow(tbody, tk, rowIdx++, qCols, totalCols));
        }
      }
    }

    table.appendChild(tbody);

    const wrap = document.getElementById('tableWrap');
    wrap.innerHTML = '';
    wrap.appendChild(table);

    // Methodology goes inside the scrollable area, after the table
    const methDiv = document.createElement('div');
    methDiv.id = 'methodology';
    methDiv.className = 'methodology';
    wrap.appendChild(methDiv);
  }

  function addSpacer(tbody, totalCols) {
    const spacer = document.createElement('tr');
    spacer.className = 'group-spacer';
    const spTd = document.createElement('td');
    spTd.colSpan = totalCols;
    spacer.appendChild(spTd);
    tbody.appendChild(spacer);
  }

  function buildGroup(tbody, label, list, qCols, totalCols) {
    const gr = document.createElement('tr');
    gr.className = 'group-header';
    const gdTd = document.createElement('td');
    gdTd.colSpan = totalCols;
    gdTd.textContent = label;
    gr.appendChild(gdTd);
    tbody.appendChild(gr);

    list.forEach((tk, idx) => buildTickerRow(tbody, tk, idx, qCols, totalCols));
  }

  function buildTickerRow(tbody, tk, idx, qCols, totalCols) {
    const rowEl = document.createElement('tr');
    rowEl.className = idx % 2 === 0 ? 'row-even' : 'row-odd';
    // Store sort values on the row
    rowEl._sortData = {};

    // Ticker
    const tdTicker = document.createElement('td');
    tdTicker.className = 'ticker-cell';
    const tag = tk.epsType === 'Adj' ? '[A]' : '[G]';
    tdTicker.innerHTML = tk.ticker + '<span class="eps-tag">' + tag + '</span>';
    rowEl.appendChild(tdTicker);
    rowEl._sortData.ticker = tk.ticker;

    // Price with $ (divide by 1000 if >10000 for Korean stocks, /100 for UK pence)
    const anyRow = tk.years['CY2025'] || tk.years['CY2026'] || Object.values(tk.years)[0];
    let price = parseFloat(anyRow.Price);
    let priceDisplay = '';
    if (!isNaN(price)) {
      if (price > 10000) {
        priceDisplay = '$' + (price / 1000).toFixed(0) + 'k';
      } else {
        priceDisplay = '$' + Math.round(price);
      }
    }
    appendCell(rowEl, priceDisplay);
    rowEl._sortData.price = isNaN(price) ? 0 : price;

    // P/E: use CSV PE for CY2026 (already pence-adjusted), compute CY2027/28
    // Derive the effective price-for-PE from CY2026's PE and EPS
    let priceForPE = price;
    const cy26Row = tk.years['CY2026'];
    if (cy26Row) {
      const csvPE = parseFloat(cy26Row.PE);
      const cy26vals = qCols.map(q => { const n = parseFloat(cy26Row[q]); return isNaN(n) ? null : n; }).filter(v => v !== null);
      if (!isNaN(csvPE) && cy26vals.length > 0) {
        priceForPE = csvPE * cy26vals[cy26vals.length - 1]; // back out effective price
      }
    }
    function calcPE(yr) {
      const yrRow = tk.years[yr];
      if (!yrRow || !priceForPE) return NaN;
      const v = qCols.map(q => { const n = parseFloat(yrRow[q]); return isNaN(n) ? null : n; }).filter(v => v !== null);
      return v.length > 0 ? priceForPE / v[v.length - 1] : NaN;
    }
    for (const [yr, key] of [['CY2026','pe26'], ['CY2027','pe27'], ['CY2028','pe28']]) {
      const pe = calcPE(yr);
      appendCell(rowEl, isNaN(pe) ? '' : pe.toFixed(1) + 'x');
      rowEl._sortData[key] = isNaN(pe) ? 999 : pe;
    }

    // FYE
    appendCell(rowEl, tk.fye || '');
    rowEl._sortData.fye = tk.fye || '';

    // Year columns
    displayYears.forEach(yr => {
      const yearRow = tk.years[yr];
      const vals = qCols.map(q => {
        if (!yearRow) return null;
        const v = parseFloat(yearRow[q]);
        return isNaN(v) ? null : v;
      });

      const nonNull = [];
      vals.forEach((v, i) => { if (v !== null) nonNull.push({ v, i }); });

      const cur = nonNull.length > 0 ? nonNull[nonNull.length - 1].v : null;
      const m3 = getFromEnd(nonNull, 1);
      const m6 = getFromEnd(nonNull, 2);
      const m12 = getFromEnd(nonNull, 4);

      const curTd = appendCell(rowEl, fmtEst(cur));
      curTd.classList.add('year-sep');
      rowEl._sortData['cur_' + yr] = cur || 0;
      appendCell(rowEl, fmtEst(m3));
      rowEl._sortData['m3_' + yr] = m3 || 0;
      appendCell(rowEl, fmtEst(m6));
      rowEl._sortData['m6_' + yr] = m6 || 0;
      appendCell(rowEl, fmtEst(m12));
      rowEl._sortData['m12_' + yr] = m12 || 0;

      // Sparkline
      const sparkTd = document.createElement('td');
      sparkTd.className = 'spark-cell';
      const sparkVals = vals.filter(v => v !== null);
      if (sparkVals.length >= 2) {
        const svg = buildSparkline(sparkVals, 70, 20);
        svg.classList.add('sparkline');
        svg.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleDetail(tk, rowEl, qCols, totalCols);
        });
        sparkTd.appendChild(svg);
      }
      rowEl.appendChild(sparkTd);

      // % changes: 3m, 3-6m, 6-12m, 12m
      const chg3 = pctChgVal(cur, m3);
      const chg36 = pctChgVal(m3, m6);
      const chg612 = pctChgVal(m6, m12);
      const rev12 = pctChgVal(cur, m12);
      appendPctCell(rowEl, cur, m3);
      rowEl._sortData['chg3_' + yr] = chg3 || 0;
      appendPctCell(rowEl, m3, m6);
      rowEl._sortData['chg36_' + yr] = chg36 || 0;
      appendPctCell(rowEl, m6, m12);
      rowEl._sortData['chg612_' + yr] = chg612 || 0;
      appendPctCell(rowEl, cur, m12);
      rowEl._sortData['rev12_' + yr] = rev12 || 0;
    });

    // Returns: YTD, L3M, 1Y
    const retRow = tk.years['CY2025'] || Object.values(tk.years)[0];
    const retytd = parsePctStr(retRow['Return_YTD']);
    const ret3m = parsePctStr(retRow['Return_3m']);
    const ret12 = parsePctStr(retRow['Return_12m']);
    const ytdTd = appendReturnCell(rowEl, retRow['Return_YTD']);
    ytdTd.classList.add('year-sep');
    rowEl._sortData.retytd = retytd;
    appendReturnCell(rowEl, retRow['Return_3m']);
    rowEl._sortData.ret3m = ret3m;
    appendReturnCell(rowEl, retRow['Return_12m']);
    rowEl._sortData.ret12 = ret12;

    tbody.appendChild(rowEl);
  }

  // --- Sorting ---
  let sortState = { key: null, dir: 'asc' };

  function addSortTH(row, text, sortKey, cls) {
    const th = document.createElement('th');
    th.textContent = text;
    th.className = 'sortable' + (cls ? ' ' + cls : '');
    th.dataset.sortKey = sortKey;
    th.addEventListener('click', () => handleSort(sortKey, th));
    row.appendChild(th);
    return th;
  }

  function handleSort(key, th) {
    // Toggle direction
    if (sortState.key === key) {
      sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
    } else {
      sortState.key = key;
      sortState.dir = key === 'ticker' ? 'asc' : 'desc'; // default desc for numbers
    }

    // Update header styling
    document.querySelectorAll('th.sortable').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
    th.classList.add(sortState.dir === 'asc' ? 'sort-asc' : 'sort-desc');

    // Sort each group independently
    const table = document.getElementById('mainTable');
    const tbody = table.querySelector('tbody');
    const groups = [];
    let currentGroup = null;

    for (const row of [...tbody.children]) {
      if (row.classList.contains('group-header')) {
        currentGroup = { header: row, rows: [] };
        groups.push(currentGroup);
      } else if (row.classList.contains('group-spacer')) {
        if (currentGroup) currentGroup.spacerAfter = row;
      } else if (row.classList.contains('detail-row')) {
        // skip detail rows during sort
      } else if (currentGroup) {
        currentGroup.rows.push(row);
      }
    }

    const dir = sortState.dir === 'asc' ? 1 : -1;
    groups.forEach(g => {
      g.rows.sort((a, b) => {
        const av = a._sortData ? a._sortData[key] : 0;
        const bv = b._sortData ? b._sortData[key] : 0;
        if (typeof av === 'string' && typeof bv === 'string') return av.localeCompare(bv) * dir;
        return ((av || 0) - (bv || 0)) * dir;
      });
    });

    // Rebuild tbody
    tbody.innerHTML = '';
    groups.forEach((g, gi) => {
      tbody.appendChild(g.header);
      g.rows.forEach((r, i) => {
        r.className = i % 2 === 0 ? 'row-even' : 'row-odd';
        r.querySelector('td:first-child').style.background = i % 2 === 0 ? '#fff' : '#f7f7f7';
        tbody.appendChild(r);
      });
      if (g.spacerAfter) tbody.appendChild(g.spacerAfter);
    });
  }

  // --- Helpers ---
  function addTH(row, text, colspan, cls) {
    const th = document.createElement('th');
    th.textContent = text;
    if (colspan > 1) th.colSpan = colspan;
    if (cls) th.className = cls;
    row.appendChild(th);
    return th;
  }

  function getFromEnd(nonNull, n) {
    if (nonNull.length === 0) return null;
    const idx = nonNull.length - 1 - n;
    return idx >= 0 ? nonNull[idx].v : null;
  }

  function fmtEst(v) {
    if (v === null || v === undefined) return '';
    if (Math.abs(v) >= 1000) return (v / 1000).toFixed(1) + 'k';
    return v.toFixed(2);
  }

  function pctChgVal(cur, base) {
    if (cur === null || base === null || base === 0) return null;
    return ((cur - base) / Math.abs(base)) * 100;
  }

  function fmtPctChg(cur, base) {
    const pct = pctChgVal(cur, base);
    if (pct === null) return '';
    if (pct >= 0) return '+' + pct.toFixed(0) + '%';
    return '(' + Math.abs(pct).toFixed(0) + '%)';
  }

  function parsePctStr(s) {
    if (!s) return 0;
    const n = parseFloat(s.replace('%', '').replace('+', '').replace('(', '-').replace(')', ''));
    return isNaN(n) ? 0 : n;
  }

  function appendCell(row, text, isChange) {
    const td = document.createElement('td');
    td.textContent = text;
    if (isChange && text) {
      if (text.startsWith('+')) td.className = 'pos';
      else if (text.startsWith('(')) td.className = 'neg';
    }
    row.appendChild(td);
    return td;
  }

  function appendPctCell(row, cur, base) {
    return appendCell(row, fmtPctChg(cur, base), true);
  }

  function appendReturnCell(row, rawVal) {
    const td = document.createElement('td');
    if (!rawVal) { row.appendChild(td); return td; }
    const num = parseFloat(rawVal);
    if (isNaN(num)) { td.textContent = rawVal; row.appendChild(td); return td; }
    if (num >= 0) { td.textContent = '+' + Math.round(num) + '%'; td.className = 'pos'; }
    else { td.textContent = '(' + Math.round(Math.abs(num)) + '%)'; td.className = 'neg'; }
    row.appendChild(td);
    return td;
  }

  function buildSparkline(vals, w, h) {
    const pad = 2, min = Math.min(...vals), max = Math.max(...vals), range = max - min || 1;
    const points = vals.map((v, i) => {
      const x = pad + (i / (vals.length - 1)) * (w - 2 * pad);
      const y = pad + (1 - (v - min) / range) * (h - 2 * pad);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    const color = vals[vals.length - 1] >= vals[0] ? '#2e7d32' : '#c62828';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', w); svg.setAttribute('height', h);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    pl.setAttribute('points', points.join(' ')); pl.setAttribute('fill', 'none');
    pl.setAttribute('stroke', color); pl.setAttribute('stroke-width', '1.5');
    svg.appendChild(pl);
    return svg;
  }

  function toggleDetail(tk, rowEl, qCols, totalCols) {
    const existing = rowEl.nextElementSibling;
    if (existing && existing.classList.contains('detail-row')) { existing.remove(); return; }

    const detailRow = document.createElement('tr');
    detailRow.className = 'detail-row';
    const td = document.createElement('td');
    td.colSpan = totalCols;

    const dtable = document.createElement('table');
    dtable.className = 'detail-table';

    const headerTr = document.createElement('tr');
    const cornerTh = document.createElement('th');
    cornerTh.textContent = '';
    headerTr.appendChild(cornerTh);
    qCols.forEach(q => {
      const th = document.createElement('th');
      const m = q.match(/Q(\d) (\d{4})/);
      th.textContent = 'Q' + m[1] + "'" + m[2].slice(2);
      headerTr.appendChild(th);
    });
    dtable.appendChild(headerTr);

    displayYears.forEach(yr => {
      const yearRow = tk.years[yr];
      if (!yearRow) return;

      const vr = document.createElement('tr');
      const yrTd = document.createElement('td');
      yrTd.className = 'yr-label';
      yrTd.textContent = yr;
      vr.appendChild(yrTd);

      const vals = [];
      qCols.forEach(q => {
        const raw = yearRow[q];
        const v = parseFloat(raw);
        vals.push(isNaN(v) || raw === '' ? null : v);
        const vtd = document.createElement('td');
        vtd.textContent = vals[vals.length - 1] !== null ? vals[vals.length - 1].toFixed(2) : '';
        vr.appendChild(vtd);
      });
      for (let i = vals.length - 1; i >= 0; i--) {
        if (vals[i] !== null) { vr.children[i + 1].style.fontWeight = '700'; break; }
      }
      dtable.appendChild(vr);

      const cr = document.createElement('tr');
      cr.className = 'chg-row';
      cr.appendChild(document.createElement('td'));
      let prevVal = null;
      vals.forEach(v => {
        const ctd = document.createElement('td');
        if (v !== null && prevVal !== null && prevVal !== 0) {
          const chg = ((v - prevVal) / Math.abs(prevVal)) * 100;
          ctd.textContent = chg >= 0 ? '+' + chg.toFixed(1) + '%' : '(' + Math.abs(chg).toFixed(1) + '%)';
          ctd.className = chg >= 0 ? 'pos' : 'neg';
          if (Math.abs(chg) >= 5) ctd.style.fontWeight = '700';
        }
        cr.appendChild(ctd);
        if (v !== null) prevVal = v;
      });
      dtable.appendChild(cr);
    });

    td.appendChild(dtable);
    detailRow.appendChild(td);
    rowEl.after(detailRow);
  }

  /* ---- Tabs ---- */
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      // Show Group By only on Companies tab
      document.querySelector('.header-right').style.visibility = tab.dataset.tab === 'companies' ? '' : 'hidden';
    });
  });

  document.querySelectorAll('#aggGroupToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#aggGroupToggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentAggGroup = btn.dataset.agg;
      if (lastData) renderAggregates(lastData);
    });
  });

  /* ---- Aggregates tab ---- */
  function renderAggregates(data) {
    const { rows, qCols } = data;

    // Parse all tickers with their metrics
    const tickerMap = {};
    rows.forEach(r => {
      const t = r.Ticker;
      if (!tickerMap[t]) {
        tickerMap[t] = {
          group: r['Group'] || '', gicsSector: r['GICS Sector'] || '', gicsIndustry: r['GICS Industry'] || '',
          years: {}, retYtd: parsePctStr(r['Return_YTD']), ret3m: parsePctStr(r['Return_3m']),
          ret12m: parsePctStr(r['Return_12m']),
        };
      }
      tickerMap[t].years[r.Year] = r;
    });

    // Compute revision metrics per ticker per year
    const tickerMetrics = {};
    for (const [t, info] of Object.entries(tickerMap)) {
      tickerMetrics[t] = { ticker: t, group: info.group, gicsSector: info.gicsSector, gicsIndustry: info.gicsIndustry,
        retYtd: info.retYtd, ret3m: info.ret3m, ret12m: info.ret12m, yearRevs: {} };
      for (const yr of displayYears) {
        const yearRow = info.years[yr];
        if (!yearRow) continue;
        const vals = qCols.map(q => { const v = parseFloat(yearRow[q]); return isNaN(v) ? null : v; });
        const nonNull = [];
        vals.forEach((v, i) => { if (v !== null) nonNull.push({ v, i }); });
        const cur = nonNull.length > 0 ? nonNull[nonNull.length - 1].v : null;
        const m3 = getFromEnd(nonNull, 1);
        const m6 = getFromEnd(nonNull, 2);
        const m12 = getFromEnd(nonNull, 4);
        tickerMetrics[t].yearRevs[yr] = {
          chg3: pctChgVal(cur, m3), chg36: pctChgVal(m3, m6),
          chg612: pctChgVal(m6, m12), rev12: pctChgVal(cur, m12),
        };
      }
    }

    // Separate indices/ETFs and portfolio from sector groups
    const indexMembers = [];
    const portfolioMembers = [];
    const groupField = currentAggGroup === 'gics_sector' ? 'gicsSector' : 'gicsIndustry';
    const groups = {};
    for (const [t, m] of Object.entries(tickerMetrics)) {
      if (INDEX_TICKERS.has(t)) { indexMembers.push(m); continue; }
      if (m.group === 'Portfolio') portfolioMembers.push(m);
      const key = m[groupField] || 'Other';
      if (!groups[key]) groups[key] = [];
      groups[key].push(m);
    }

    const groupLabel = currentAggGroup === 'gics_sector' ? 'Sector' : 'Industry';
    const wrap = document.getElementById('aggTableWrap');
    wrap.innerHTML = '';

    // Column keys for sorting
    const colKeys = ['name', 'count'];
    displayYears.forEach(yr => { for (const m of ['chg3','chg36','chg612','rev12']) colKeys.push(yr+'_'+m); });
    colKeys.push('retYtd', 'ret3m', 'ret12m');

    function buildAggRow(label, members, statFn, idx) {
      const tr = document.createElement('tr');
      tr.className = idx % 2 === 0 ? 'agg-row-even' : 'agg-row-odd';
      tr._sortData = { name: label, count: members.length };
      tr._aggMembers = members;

      const tdName = document.createElement('td');
      tdName.textContent = label;
      tdName.addEventListener('click', () => toggleAggDetail(tr, members, tr.closest('tbody')));
      tr.appendChild(tdName);

      const tdN = document.createElement('td');
      tdN.textContent = members.length; tdN.style.textAlign = 'center';
      tr.appendChild(tdN);

      displayYears.forEach(yr => {
        let first = true;
        for (const metric of ['chg3', 'chg36', 'chg612', 'rev12']) {
          const vals = members.map(m => m.yearRevs[yr] ? m.yearRevs[yr][metric] : null).filter(v => v !== null);
          const v = statFn(vals);
          const td = appendAggCell(tr, v);
          if (first) { td.classList.add('year-sep'); first = false; }
          tr._sortData[yr + '_' + metric] = v || 0;
        }
      });

      const yVals = members.map(m => m.retYtd).filter(v => v && !isNaN(v));
      const l3Vals = members.map(m => m.ret3m).filter(v => v && !isNaN(v));
      const y1Vals = members.map(m => m.ret12m).filter(v => v && !isNaN(v));
      const vy = statFn(yVals), vl = statFn(l3Vals), v1 = statFn(y1Vals);
      const retFirst = appendAggCell(tr, vy); retFirst.classList.add('year-sep');
      appendAggCell(tr, vl); appendAggCell(tr, v1);
      tr._sortData.retYtd = vy || 0; tr._sortData.ret3m = vl || 0; tr._sortData.ret12m = v1 || 0;

      return tr;
    }

    const allNonIndex = Object.values(groups).flat();
    const allKeys = Object.keys(groups).sort((a, b) => {
      if (a === 'Other') return 1; if (b === 'Other') return -1;
      return a.localeCompare(b);
    });

    for (const [statLabel, statFn] of [['Median', median], ['Mean', mean]]) {
      const title = document.createElement('h3');
      title.textContent = statLabel + ' EPS Revisions & Returns by ' + groupLabel;
      title.style.cssText = 'padding: 16px 0 4px; font-size: 14px; color: #333;';
      wrap.appendChild(title);

      const table = document.createElement('table');
      table.className = 'agg-table';

      const colgroup = document.createElement('colgroup');
      const addCol = (cls) => { const c = document.createElement('col'); c.className = cls; colgroup.appendChild(c); };
      addCol('col-name'); addCol('col-count');
      for (let i = 0; i < displayYears.length * 4 + 3; i++) addCol('col-data');
      table.appendChild(colgroup);

      // Header row 1
      const h1 = document.createElement('tr');
      const addH = (text, colspan, cls) => {
        const th = document.createElement('th');
        th.textContent = text; if (colspan > 1) th.colSpan = colspan;
        if (cls) th.className = cls; h1.appendChild(th);
      };
      addH('', 1, 'agg-group'); addH('#', 1, 'agg-group');
      displayYears.forEach(yr => addH(yr, 4, 'agg-group year-sep'));
      addH('Returns', 3, 'agg-group year-sep');

      // Header row 2 — sortable
      const h2 = document.createElement('tr');
      let colIdx = 0;
      const addSortH = (text, cls) => {
        const th = document.createElement('th');
        th.textContent = text;
        th.className = 'agg-sub sortable' + (cls ? ' ' + cls : '');
        const key = colKeys[colIdx++];
        th.dataset.sortKey = key;
        th.addEventListener('click', () => sortAggTable(table, key, th));
        h2.appendChild(th);
      };
      addSortH(groupLabel); addSortH('#');
      displayYears.forEach(() => {
        addSortH('3m', 'year-sep'); addSortH('3-6m'); addSortH('6-12m'); addSortH('12m');
      });
      addSortH('YTD', 'year-sep'); addSortH('L3M'); addSortH('1Y');

      const thead = document.createElement('thead');
      thead.appendChild(h1); thead.appendChild(h2);
      table.appendChild(thead);

      // Build rows with sort data
      const tbody = document.createElement('tbody');

      // "All" total row
      const allRow = buildAggRow('All', allNonIndex, statFn, 0);
      allRow.querySelector('td:first-child').style.fontWeight = '700';
      allRow.querySelectorAll('td').forEach(td => td.style.borderBottom = '2px solid #ccc');
      tbody.appendChild(allRow);

      // Portfolio aggregate row
      if (portfolioMembers.length > 0) {
        const ptr = buildAggRow('Portfolio', portfolioMembers, statFn, 1);
        ptr.querySelector('td:first-child').style.fontStyle = 'italic';
        ptr.querySelectorAll('td').forEach(td => td.style.borderBottom = '2px solid #ccc');
        tbody.appendChild(ptr);
      }

      allKeys.forEach((key, idx) => {
        tbody.appendChild(buildAggRow(key, groups[key], statFn, idx));
      });

      // Add indices as individual rows at the bottom (no spacer)
      indexMembers.forEach((m, i) => {
        const tr = buildAggRow(m.ticker, [m], statFn, allKeys.length + i);
        tr.children[1].textContent = '';
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      wrap.appendChild(table);
    }

    const revBuckets = [-20, -10, -5, 0, 5, 10, 20];
    const retBuckets = [-30, -20, -10, 0, 10, 20, 30, 50];

    function buildDistTable(cyYear) {
      const title = document.createElement('h3');
      title.textContent = cyYear + ' EPS Revision & Return Distribution by ' + groupLabel + ' (% of stocks above threshold)';
      title.style.cssText = 'padding: 16px 0 4px; font-size: 14px; color: #333;';
      wrap.appendChild(title);

      const table = document.createElement('table');
      table.className = 'agg-table';
      const cg = document.createElement('colgroup');
      const addC = (cls) => { const c = document.createElement('col'); c.className = cls; cg.appendChild(c); };

  // --- Aggregate sorting and detail ---

  function sortAggTable(table, key, th) {
    const tbody = table.querySelector('tbody');
    tbody.querySelectorAll('.agg-detail').forEach(r => r.remove());

    const currentDir = th.classList.contains('sort-asc') ? 'asc' : th.classList.contains('sort-desc') ? 'desc' : null;
    // Update ALL agg tables' sort indicators to stay in sync
    document.querySelectorAll('.agg-table th.sortable').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
    const dir = currentDir === 'desc' ? 'asc' : 'desc';
    aggSortState = { key, dir };

    // Apply sort to ALL agg tables
    document.querySelectorAll('.agg-table').forEach(t => {
      // Set sort indicator on matching header
      t.querySelectorAll('th.sortable').forEach(h => {
        if (h.dataset.sortKey === key) h.classList.add(dir === 'asc' ? 'sort-asc' : 'sort-desc');
      });
      const tb = t.querySelector('tbody');
      if (!tb) return;
      tb.querySelectorAll('.agg-detail').forEach(r => r.remove());
      const mult = dir === 'asc' ? 1 : -1;
      const rows = [...tb.querySelectorAll('tr:not(.agg-detail)')];
      rows.sort((a, b) => {
        const av = a._sortData ? a._sortData[key] : 0;
        const bv = b._sortData ? b._sortData[key] : 0;
        if (typeof av === 'string' && typeof bv === 'string') return av.localeCompare(bv) * mult;
        return ((av || 0) - (bv || 0)) * mult;
      });
      tb.innerHTML = '';
      rows.forEach((r, i) => { r.className = i % 2 === 0 ? 'agg-row-even' : 'agg-row-odd'; tb.appendChild(r); });
    });
  }

  function sortMembersByCurrentKey(members) {
    if (!aggSortState.key || aggSortState.key === 'name' || aggSortState.key === 'count') return members;
    const key = aggSortState.key;
    const mult = aggSortState.dir === 'asc' ? 1 : -1;
    return [...members].sort((a, b) => {
      let av = 0, bv = 0;
      if (key === 'retYtd') { av = a.retYtd || 0; bv = b.retYtd || 0; }
      else if (key === 'ret3m') { av = a.ret3m || 0; bv = b.ret3m || 0; }
      else if (key === 'ret12m') { av = a.ret12m || 0; bv = b.ret12m || 0; }
      else {
        // Parse year and metric from key like "CY2026_chg3"
        const parts = key.split('_');
        const yr = parts[0], metric = parts[1];
        av = (a.yearRevs[yr] && a.yearRevs[yr][metric]) || 0;
        bv = (b.yearRevs[yr] && b.yearRevs[yr][metric]) || 0;
      }
      return (av - bv) * mult;
    });
  }

  function toggleAggDetail(tr, members, tbody) {
    const existing = [];
    let next = tr.nextElementSibling;
    while (next && next.classList.contains('agg-detail')) {
      existing.push(next); next = next.nextElementSibling;
    }
    if (existing.length > 0) { existing.forEach(r => r.remove()); return; }

    // Sort members by current sort key
    const sorted = sortMembersByCurrentKey(members);

    // Build detail rows in correct order
    const detailRows = [];
    sorted.forEach(m => {
      const dr = document.createElement('tr');
      dr.className = 'agg-detail';
      const tdT = document.createElement('td');
      tdT.textContent = m.ticker || ''; dr.appendChild(tdT);
      dr.appendChild(document.createElement('td'));

      displayYears.forEach(yr => {
        let first = true;
        for (const metric of ['chg3', 'chg36', 'chg612', 'rev12']) {
          const v = m.yearRevs[yr] ? m.yearRevs[yr][metric] : null;
          const td = appendAggCell(dr, v);
          if (first) { td.classList.add('year-sep'); first = false; }
        }
      });
      const retFirst = appendAggCell(dr, m.retYtd); retFirst.classList.add('year-sep');
      appendAggCell(dr, m.ret3m); appendAggCell(dr, m.ret12m);
      detailRows.push(dr);
    });

    // Insert after tr in correct order
    let insertAfter = tr;
    detailRows.forEach(dr => { insertAfter.after(dr); insertAfter = dr; });
  }

  function median(arr) {
    if (!arr.length) return null;
    const s = [...arr].sort((a, b) => a - b);
    const mid = Math.floor(s.length / 2);
    return s.length % 2 === 0 ? (s[mid - 1] + s[mid]) / 2 : s[mid];
  }

  function mean(arr) {
    if (!arr.length) return null;
    return arr.reduce((a, b) => a + b, 0) / arr.length;
  }

  function appendAggCell(row, val) {
    const td = document.createElement('td');
    if (val !== null) {
      if (val >= 0) { td.textContent = '+' + val.toFixed(0) + '%'; td.className = 'pos'; }
      else { td.textContent = '(' + Math.abs(val).toFixed(0) + '%)'; td.className = 'neg'; }
    }
    row.appendChild(td);
    return td;
  }

  /* ---- Analysis tab ---- */

    function renderScatterSVG(filteredStocks, xKey, yKey, xLabel, yLabel, sectors, bounds, gridStep, showAllLabels) {

      const W = 700, H = 500, pad = { top: 20, right: 30, bottom: 40, left: 50 };

      const xMin = bounds[0], xMax = bounds[1], yMin = bounds[2], yMax = bounds[3];
      const pts = filteredStocks.filter(s => s[xKey] !== null && s[yKey] !== null && s[yKey] !== 0);

      svg.style.width = '100%'; svg.style.height = 'auto';
      svg.style.fontSize = '10px'; svg.style.fontFamily = 'inherit';

      // Grid lines and axes
      const toX = v => pad.left + ((Math.max(xMin, Math.min(xMax, v)) - xMin) / (xMax - xMin)) * pw;
      const toY = v => pad.top + (1 - (Math.max(yMin, Math.min(yMax, v)) - yMin) / (yMax - yMin)) * ph;

      // Gridlines
      const step = gridStep || 10;
      for (let g = xMin; g <= xMax; g += step) {

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');

        line.setAttribute('x2', x); line.setAttribute('y2', pad.top + ph);

        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', x); txt.setAttribute('y', H - 5); txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('fill', '#444');
        txt.textContent = g + '%'; svg.appendChild(txt);
      }
      for (let g = yMin; g <= yMax; g += step) {
        const y = toY(g);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', pad.left); line.setAttribute('y1', y);
        line.setAttribute('x2', pad.left + pw); line.setAttribute('y2', y);
        line.setAttribute('stroke', g === 0 ? '#777' : '#ddd'); line.setAttribute('stroke-width', g === 0 ? 1 : 0.5);
        svg.appendChild(line);
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');

      wrapper.appendChild(tooltip);

        const isPortfolio = s.group === 'Portfolio';

        c.setAttribute('stroke', isPortfolio ? '#0d47a1' : 'none');

      // Layer 2: Sector/industry dots (medium, orange) with label collision avoidance
      if (sectors) {

        sectors.forEach(s => {

          c.addEventListener('mouseleave', () => {
            c.setAttribute('r', 3.5); c.setAttribute('opacity', 0.7); tooltip.style.display = 'none';
          });
          svg.appendChild(c);

          // Try multiple label positions to avoid overlap
          const labelW = s.name.length * 5, labelH = 9;
          const offsets = [

            [6, 10], [6, -12], [-labelW - 4, 10], [-labelW - 4, -12],
          ];
          let bestX = cx + 6, bestY = cy + 3, bestOverlap = Infinity;
          for (const [dx, dy] of offsets) {
            const lx = cx + dx, ly = cy + dy;
            let overlap = 0;
            for (const p of placed) {
              if (Math.abs(lx - p.x) < (labelW + p.w) * 0.5 && Math.abs(ly - p.y) < labelH) overlap++;
            }
            if (overlap < bestOverlap) { bestOverlap = overlap; bestX = lx; bestY = ly; }
            if (overlap === 0) break;
          }
          placed.push({ x: bestX, y: bestY, w: labelW });

          const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');

      wrap.appendChild(sec);
    }

    // ===== 3. REVISION BREADTH BY SECTOR =====
    {
      const sec = makeSection('3. Revision Breadth by Sector — % of stocks with positive 3m revisions');
      const sectorGroups = {};
      stocks.filter(s => s.rev3 !== null && s.sector).forEach(s => {
        if (!sectorGroups[s.sector]) sectorGroups[s.sector] = [];
        sectorGroups[s.sector].push(s);
      });
      const rowData = Object.entries(sectorGroups).map(([sec, members]) => {
        const pos = members.filter(s => s.rev3 > 0).length;
        const breadth = pos / members.length * 100;
        return [sec, members.length, breadth, median(members.map(s => s.rev3)), median(members.map(s => s.ret3m).filter(v => v))];
      }).sort((a, b) => b[2] - a[2]);
      sec.appendChild(makeTable(['Sector', '#', '% Positive', 'Med 3m Rev', 'Med L3M'], rowData, { pctCols: [2, 3, 4] }));
      wrap.appendChild(sec);
    }

    // ===== 4. PE COMPRESSION / EXPANSION =====
    {
      const sec = makeSection('4. PE Compression vs Expansion — revision sign vs return sign');
      const valid = stocks.filter(s => s.rev12 !== null && s.ret12m);
      const upUp = valid.filter(s => s.rev12 > 0 && s.ret12m > 0);
      const upDown = valid.filter(s => s.rev12 > 0 && s.ret12m <= 0);
      const downUp = valid.filter(s => s.rev12 <= 0 && s.ret12m > 0);
      const downDown = valid.filter(s => s.rev12 <= 0 && s.ret12m <= 0);
      const rowData = [
        ['Rev+ / Ret+ (expansion)', upUp.length, median(upUp.map(s => s.rev12)), median(upUp.map(s => s.ret12m))],
        ['Rev+ / Ret- (compression)', upDown.length, median(upDown.map(s => s.rev12)), median(upDown.map(s => s.ret12m))],
        ['Rev- / Ret+ (re-rating)', downUp.length, median(downUp.map(s => s.rev12)), median(downUp.map(s => s.ret12m))],
        ['Rev- / Ret- (de-rating)', downDown.length, median(downDown.map(s => s.rev12)), median(downDown.map(s => s.ret12m))],
      ];
      const p = document.createElement('p');
      p.style.cssText = 'font-size:12px;color:#555;margin-bottom:8px;';
      p.textContent = 'Rev+ / Ret- stocks may be value opportunities (earnings improving but stock falling). Rev- / Ret+ stocks may be at risk.';
      sec.appendChild(p);
      sec.appendChild(makeTable(['Quadrant', '#', 'Med 12m Rev', 'Med 1Y Ret'], rowData, { pctCols: [2, 3] }));

      // Show specific Rev+ / Ret- stocks (compression candidates)
      if (upDown.length > 0) {
        const p2 = document.createElement('p');
        p2.style.cssText = 'font-size:12px;color:#555;margin:8px 0 4px;font-weight:600;';
        p2.textContent = 'Rev+ / Ret- stocks (potential value):';
        sec.appendChild(p2);
        const candidates = upDown.sort((a, b) => b.rev12 - a.rev12).slice(0, 25);
        sec.appendChild(makeTable(['Ticker', 'Group', '12m Rev', '1Y Ret', 'YTD'],
          candidates.map(s => [s.ticker, s.group, s.rev12, s.ret12m, s.retYtd]), { pctCols: [2, 3, 4] }));
      }
      wrap.appendChild(sec);
    }

    // ===== 5. ESTIMATE DISPERSION =====
    {
      const sec = makeSection('5. Estimate Dispersion — CY2026 vs CY2028 implied growth');
      const valid = stocks.filter(s => s.cur26 && s.cur28 && s.cur26 > 0);
      const withGrowth = valid.map(s => {
        const cagr = (Math.pow(s.cur28 / s.cur26, 1 / 2) - 1) * 100;
        return { ...s, cagr };
      }).sort((a, b) => b.cagr - a.cagr);

      const top20 = withGrowth.slice(0, 20);
      const bot20 = withGrowth.slice(-20).reverse();

      const cols = document.createElement('div');
      cols.className = 'analysis-columns';

      const leftDiv = document.createElement('div');
      const lh = document.createElement('h4');
      lh.textContent = 'Highest implied 2-year EPS CAGR';
      lh.style.cssText = 'font-size:12px;color:#555;margin-bottom:4px;';
      leftDiv.appendChild(lh);
      leftDiv.appendChild(makeTable(['Ticker', 'CY26 EPS', 'CY28 EPS', '2yr CAGR', 'YTD'],
        top20.map(s => [s.ticker, s.cur26, s.cur28, s.cagr, s.retYtd]), { pctCols: [3, 4], width: '100%' }));

      const rightDiv = document.createElement('div');
      const rh = document.createElement('h4');
      rh.textContent = 'Lowest implied 2-year EPS CAGR';
      rh.style.cssText = 'font-size:12px;color:#555;margin-bottom:4px;';
      rightDiv.appendChild(rh);
      rightDiv.appendChild(makeTable(['Ticker', 'CY26 EPS', 'CY28 EPS', '2yr CAGR', 'YTD'],
        bot20.map(s => [s.ticker, s.cur26, s.cur28, s.cagr, s.retYtd]), { pctCols: [3, 4], width: '100%' }));

      cols.appendChild(leftDiv); cols.appendChild(rightDiv);
      sec.appendChild(cols);
      wrap.appendChild(sec);
    }

    // ===== 6. PORTFOLIO HIT RATE =====
    {
      const sec = makeSection('6. Portfolio Hit Rate — % with positive revisions AND positive returns');
      if (portfolio.length > 0) {
        const posRevPosRet = portfolio.filter(s => s.rev3 > 0 && s.ret3m > 0).length;
        const posRev = portfolio.filter(s => s.rev3 > 0).length;
        const posRet = portfolio.filter(s => s.ret3m > 0).length;
        const total = portfolio.length;

        const summary = [
          ['Positive 3m revision', posRev, (posRev / total * 100)],
          ['Positive L3M return', posRet, (posRet / total * 100)],
          ['Both positive (hit)', posRevPosRet, (posRevPosRet / total * 100)],
          ['Total portfolio', total, null],
        ];
        sec.appendChild(makeTable(['Metric', '#', '%'], summary, { pctCols: [2] }));

        // Per-stock breakdown
        const p = document.createElement('p');
        p.style.cssText = 'font-size:12px;color:#555;margin:8px 0 4px;font-weight:600;';
        p.textContent = 'Portfolio stock detail:';
        sec.appendChild(p);
        sec.appendChild(makeTable(['Ticker', '3m Rev', 'L3M Ret', 'YTD', '12m Rev', '1Y Ret'],
          portfolio.sort((a, b) => (b.rev3 || 0) - (a.rev3 || 0)).map(s => [s.ticker, s.rev3, s.ret3m, s.retYtd, s.rev12, s.ret12m]),
          { pctCols: [1, 2, 3, 4, 5] }));
      }
      wrap.appendChild(sec);
    }

    // ===== 7. WATCHLIST SCREENING =====
    {
      const sec = makeSection('7. Watchlist Screening — positive 12m revision + negative 3m return (beaten-down improvers)');
      const candidates = stocks.filter(s => s.rev12 !== null && s.rev12 > 0 && s.ret3m < 0 && s.group !== 'Portfolio')
        .sort((a, b) => b.rev12 - a.rev12).slice(0, 30);

      if (candidates.length > 0) {
        const p = document.createElement('p');
        p.style.cssText = 'font-size:12px;color:#555;margin-bottom:8px;';
        p.textContent = 'Stocks with improving fundamentals (positive 12m EPS revision) but recent price weakness (negative L3M return). Potential buy candidates.';
        sec.appendChild(p);
        sec.appendChild(makeTable(['Ticker', 'Sector', '12m Rev', 'L3M Ret', 'YTD', 'PE'],
          candidates.map(s => [s.ticker, s.sector, s.rev12, s.ret3m, s.retYtd, s.pe ? s.pe.toFixed(1) + 'x' : '']),
          { pctCols: [2, 3, 4] }));
      }
      wrap.appendChild(sec);
    }

    // ===== 8. PORTFOLIO REVISION BETA =====
    {
      const sec = makeSection('8. Portfolio vs Market Revision Summary');
      if (portfolio.length > 0) {
        const allValid = stocks.filter(s => s.rev3 !== null);
        const mktMed3 = median(allValid.map(s => s.rev3));
        const mktMed12 = median(allValid.filter(s => s.rev12 !== null).map(s => s.rev12));
        const pfMed3 = median(portfolio.filter(s => s.rev3 !== null).map(s => s.rev3));
        const pfMed12 = median(portfolio.filter(s => s.rev12 !== null).map(s => s.rev12));
        const mktMedRet = median(allValid.map(s => s.retYtd).filter(v => v));
        const pfMedRet = median(portfolio.map(s => s.retYtd).filter(v => v));

        sec.appendChild(makeTable(['Metric', 'Portfolio', 'Market', 'Delta'], [
          ['Median 3m revision', pfMed3, mktMed3, pfMed3 !== null && mktMed3 !== null ? pfMed3 - mktMed3 : null],
          ['Median 12m revision', pfMed12, mktMed12, pfMed12 !== null && mktMed12 !== null ? pfMed12 - mktMed12 : null],
          ['Median YTD return', pfMedRet, mktMedRet, pfMedRet !== null && mktMedRet !== null ? pfMedRet - mktMedRet : null],
        ], { pctCols: [1, 2, 3] }));
      }
      wrap.appendChild(sec);
    }

    // ===== 9. MULTI-FACTOR REGRESSION =====
    {
      const sec = makeSection('9. Multi-Factor Regression — L3M Return = α + β₁(3m Rev) + β₂(PE)');

      // Simple OLS implementation
      function ols(y, X) {
        // X is array of arrays (each row = [1, x1, x2, ...]), y is array
        const n = y.length, k = X[0].length;
        // X'X
        const XtX = Array(k).fill(null).map(() => Array(k).fill(0));
        const XtY = Array(k).fill(0);
        for (let i = 0; i < n; i++) {
          for (let j = 0; j < k; j++) {
            XtY[j] += X[i][j] * y[i];
            for (let l = 0; l < k; l++) XtX[j][l] += X[i][j] * X[i][l];
          }
        }
        // Solve via Gaussian elimination
        const aug = XtX.map((row, i) => [...row, XtY[i]]);
        for (let i = 0; i < k; i++) {
          let maxRow = i;
          for (let r = i + 1; r < k; r++) if (Math.abs(aug[r][i]) > Math.abs(aug[maxRow][i])) maxRow = r;
          [aug[i], aug[maxRow]] = [aug[maxRow], aug[i]];
          if (Math.abs(aug[i][i]) < 1e-10) continue;
          for (let r = 0; r < k; r++) {
            if (r === i) continue;
            const f = aug[r][i] / aug[i][i];
            for (let c = i; c <= k; c++) aug[r][c] -= f * aug[i][c];
          }
        }
        const beta = aug.map((row, i) => row[k] / row[i]);

        // R²
        const yMean = y.reduce((a, b) => a + b, 0) / n;
        let ssTot = 0, ssRes = 0;
        for (let i = 0; i < n; i++) {
          const yHat = X[i].reduce((s, x, j) => s + x * beta[j], 0);
          ssTot += (y[i] - yMean) ** 2;
          ssRes += (y[i] - yHat) ** 2;
        }
        const r2 = 1 - ssRes / ssTot;
        return { beta, r2, n };
      }

      // Model 1: Ret = a + b1*Rev3m
      const valid1 = stocks.filter(s => s.rev3 !== null && s.ret3m);
      if (valid1.length > 10) {
        const y1 = valid1.map(s => s.ret3m);
        const X1 = valid1.map(s => [1, s.rev3]);
        const r1 = ols(y1, X1);

        // Model 2: Ret = a + b1*Rev3m + b2*Rev12m
        const valid2 = stocks.filter(s => s.rev3 !== null && s.rev12 !== null && s.ret3m);
        const y2 = valid2.map(s => s.ret3m);
        const X2 = valid2.map(s => [1, s.rev3, s.rev12]);
        const r2 = ols(y2, X2);

        // Model 3: 1Y Ret = a + b1*Rev12m
        const valid3 = stocks.filter(s => s.rev12 !== null && s.ret12m);
        const y3 = valid3.map(s => s.ret12m);
        const X3 = valid3.map(s => [1, s.rev12]);
        const r3 = ols(y3, X3);

        sec.appendChild(makeTable(['Model', 'n', 'R²', 'α (intercept)', 'β₁', 'β₂'], [
          ['L3M = α + β₁(3m Rev)', r1.n, r1.r2, r1.beta[0], r1.beta[1], ''],
          ['L3M = α + β₁(3m Rev) + β₂(12m Rev)', r2.n, r2.r2, r2.beta[0], r2.beta[1], r2.beta[2]],
          ['1Y = α + β₁(12m Rev)', r3.n, r3.r2, r3.beta[0], r3.beta[1], ''],
        ], {}));

        const p = document.createElement('p');
        p.style.cssText = 'font-size:11px;color:#888;margin-top:4px;';
        p.textContent = 'β₁ interpretation: a 1 percentage point increase in 3m EPS revision is associated with a ' + r1.beta[1].toFixed(2) + ' pp change in L3M stock return. R² of ' + r1.r2.toFixed(3) + ' means revisions explain ' + (r1.r2 * 100).toFixed(1) + '% of return variance.';
        sec.appendChild(p);
      }
      wrap.appendChild(sec);
    }

    // ===== 10. SECTOR-ADJUSTED REVISIONS =====
    {
      const sec = makeSection('10. Sector-Adjusted Revisions — do sector-adjusted revisions predict returns better?');
      const sectorMed = {};
      stocks.filter(s => s.rev3 !== null && s.sector).forEach(s => {
        if (!sectorMed[s.sector]) sectorMed[s.sector] = [];
        sectorMed[s.sector].push(s.rev3);
      });
      Object.keys(sectorMed).forEach(k => sectorMed[k] = median(sectorMed[k]));

      const adjusted = stocks.filter(s => s.rev3 !== null && s.sector && sectorMed[s.sector] !== null && s.ret3m)
        .map(s => ({ ...s, adjRev3: s.rev3 - (sectorMed[s.sector] || 0) }));

      if (adjusted.length > 10) {
        // Raw regression
        const yRaw = adjusted.map(s => s.ret3m);
        const XRaw = adjusted.map(s => [1, s.rev3]);
        const rRaw = ols(yRaw, XRaw);

        // Adjusted regression
        const yAdj = adjusted.map(s => s.ret3m);
        const XAdj = adjusted.map(s => [1, s.adjRev3]);
        const rAdj = ols(yAdj, XAdj);

        sec.appendChild(makeTable(['Model', 'n', 'R²', 'β (revision)'], [
          ['Raw 3m revision', rRaw.n, rRaw.r2, rRaw.beta[1]],
          ['Sector-adjusted 3m revision', rAdj.n, rAdj.r2, rAdj.beta[1]],
        ], {}));

        const p = document.createElement('p');
        p.style.cssText = 'font-size:11px;color:#888;margin-top:4px;';
        p.textContent = rAdj.r2 > rRaw.r2
          ? 'Sector-adjusted revisions have higher R² (' + (rAdj.r2 * 100).toFixed(1) + '% vs ' + (rRaw.r2 * 100).toFixed(1) + '%), suggesting stock-specific revision signals are more predictive than raw revisions.'
          : 'Raw revisions have higher R² (' + (rRaw.r2 * 100).toFixed(1) + '% vs ' + (rAdj.r2 * 100).toFixed(1) + '%), suggesting sector-level revision trends drive returns more than stock-specific signals.';
        sec.appendChild(p);
      }
      wrap.appendChild(sec);
    }
  }

  function renderMethodology(qCols) {
    const el = document.getElementById('methodology');
    if (!el) return;
    const labels = qCols.map(q => { const m = q.match(/Q(\d) (\d{4})/); return "Q" + m[1] + "'" + m[2].slice(2); });
    const n = labels.length;
    const cur = labels[n-1]||'?', m3 = labels[n-2]||'?', m6 = labels[n-3]||'?', m12 = labels[n-5]||'?';
    el.innerHTML =
      '<details><summary>Methodology</summary>' +
      '<p><b>Data source:</b> Bloomberg BEST_EPS (adjusted, mkt cap &lt; $200B) or BEST_EPS_GAAP (mkt cap &ge; $200B). ' +
      'TSM estimates converted to USD. Historical estimates use absolute fiscal period references ("NNY" format).</p>' +
      '<p><b>FY/CY alignment:</b> Companies with fiscal year ending in Jan–Mar (NVDA, VEEV) have estimates shifted so that ' +
      'CY columns reflect the calendar year the fiscal year mostly covers. E.g. NVDA FY2027 (ending Jan 2027) is shown as CY2026.</p>' +
      '<p><b>Estimate columns:</b> "Cur" = consensus as of end of ' + cur + '. ' +
      '"-3m" = ' + m3 + '. "-6m" = ' + m6 + '. "-1yr" = ' + m12 + '. ' +
      'Each value is the last available monthly consensus snapshot within that calendar quarter.</p>' +
      '<p><b>% change columns:</b> "3m%" = Cur vs -3m. "3-6m%" = -3m vs -6m. "6-12m%" = -6m vs -1yr. "12m%" = Cur vs -1yr.</p>' +
      '<p><b>Sparklines:</b> Show all available quarterly data points (up to ' + n + ' quarters). Click to expand full history.</p>' +
      '<p><b>Sorting:</b> Click any column header with ▲▼ to sort. Portfolio and Watchlist sections sort independently.</p>' +
      '</details>';
  }

})();
</script>
</body>
</html>
